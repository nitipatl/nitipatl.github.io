<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nitipat's Running Event</title>
<meta name="description" content="Nitipat's running race calendar — pulled from Google Calendar." />
<style>
  :root {
    --accent: #de4c4f;
    --accent-2: #e06e73;
    --blue: #4a9eff;
    --bg: #0d0f12;
    --panel: #14171b;
    --panel-2: #1a1e23;
    --text: #ececed;
    --muted: #8b9199;
    --faint: #666d75;
    --border: #24282e;
    --chip: #1a1e23;
    --chip-on: rgba(74,158,255,.16);
    --chip-on-bd: #3b6ea5;
    /* green race-intensity scale */
    --g0: #1b2027; --g1: #0e4429; --g2: #006d32; --g3: #26a641; --g4: #39d353;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Thai", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Noto Serif Thai", serif;
  }
  :root[data-theme="light"] {
    --bg: #fbfbfa; --panel: #ffffff; --panel-2: #f4f5f6; --text: #1c1e21;
    --muted: #6a7079; --faint: #9aa0a6; --border: #e6e7e9; --chip: #f2f3f4;
    --chip-on: rgba(74,158,255,.12); --chip-on-bd: #9cc4f0;
    --g0: #ebedef; --g1: #9be9a8; --g2: #40c463; --g3: #30a14e; --g4: #216e39;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fbfbfa; --panel: #ffffff; --panel-2: #f4f5f6; --text: #1c1e21;
      --muted: #6a7079; --faint: #9aa0a6; --border: #e6e7e9; --chip: #f2f3f4;
      --chip-on: rgba(74,158,255,.12); --chip-on-bd: #9cc4f0;
      --g0: #ebedef; --g1: #9be9a8; --g2: #40c463; --g3: #30a14e; --g4: #216e39;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: var(--accent); text-decoration: none; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 34px 22px 72px; }

  /* Header */
  .eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .eyebrow .kicker { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .eyebrow .kicker:before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .badge { font-size: .7rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.live { color: #2ea36a; border-color: rgba(46,163,106,.4); }
  .badge.snap { color: var(--accent-2); border-color: rgba(224,110,115,.4); }
  .icon-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 9px; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
  .icon-btn:hover { border-color: var(--accent-2); }

  h1.title { font-family: var(--serif); font-weight: 600; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.02; letter-spacing: -.01em; margin: 18px 0 16px; }
  .summary { color: var(--muted); font-size: .96rem; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
  .summary .sep { color: var(--faint); margin: 0 6px; }
  .summary b { color: var(--text); font-weight: 600; }
  .rule { height: 1px; background: var(--border); margin: 22px 0; border: 0; }

  /* Countdown */
  .countdown { display: flex; align-items: baseline; gap: 10px; font-size: .96rem; color: var(--muted); margin: 2px 0 4px; }
  .countdown b { color: var(--text); }
  .countdown .n { color: var(--accent); font-weight: 800; font-size: 1.15rem; }

  /* Heatmap */
  .hm-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .hm-head .lbl { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .hm-head .cnt { font-size: .84rem; color: var(--faint); }
  .hm-head select { font-family: inherit; font-size: .82rem; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
  .hm-outer { overflow-x: auto; padding-bottom: 4px; }
  .hm2 { display: grid; grid-template-columns: 30px repeat(12, minmax(26px, 1fr)); grid-template-rows: 18px repeat(5, 42px); gap: 2px; min-width: 560px; }
  .hm2 .mlabel { font-size: .66rem; color: var(--muted); text-align: center; align-self: center; }
  .hm2 .wlabel { font-size: .62rem; color: var(--faint); align-self: center; }
  .hm2 .cell { display: flex; align-items: center; justify-content: center; }
  .hm2 .sq { width: 60%; height: 60%; min-width: 12px; min-height: 12px; border-radius: 5px; background: var(--g0); transition: transform .1s; }
  .hm2 .cell.has { cursor: pointer; }
  .hm2 .cell.has:hover .sq { transform: scale(1.12); }
  .sq.s1 { width: 46%; height: 46%; } .sq.s2 { width: 62%; height: 62%; } .sq.s3 { width: 78%; height: 78%; } .sq.s4 { width: 92%; height: 92%; }
  .sq.l1 { background: var(--g1); } .sq.l2 { background: var(--g2); } .sq.l3 { background: var(--g3); } .sq.l4 { background: var(--g4); }
  .cell.past .sq { opacity: .42; }
  .cell.now .sq { box-shadow: 0 0 0 2px var(--blue); }
  .hm-legend { display: flex; align-items: center; gap: 6px; font-size: .74rem; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
  .hm-legend .sq { width: 13px; height: 13px; border-radius: 4px; background: var(--g0); display: inline-block; }
  .hm-legend .gap { width: 10px; }
  .hm-legend .now-s { width: 13px; height: 13px; border-radius: 4px; box-shadow: inset 0 0 0 2px var(--blue); display: inline-block; }

  /* Filters */
  .fgroup { margin: 16px 0; }
  .fgroup .ftitle { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-family: inherit; font-size: .9rem; color: var(--text); background: var(--chip); border: 1px solid var(--border); border-radius: 999px; padding: 8px 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: border-color .12s, background .12s; }
  .chip:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .chip:hover { border-color: var(--accent-2); }
  .chip.on { background: var(--chip-on); border-color: var(--chip-on-bd); }
  .chip.on:before { background: var(--blue); }
  .chip .th { color: var(--faint); font-size: .82em; }
  .search { width: 100%; margin-top: 6px; font-family: inherit; font-size: .92rem; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; outline: none; }
  .search:focus { border-color: var(--accent-2); }

  .statusline { color: var(--faint); font-size: .86rem; margin: 20px 0 8px; }

  /* Event rows */
  .ev { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 20px 0; border-top: 1px solid var(--border); }
  .ev:first-child { border-top: 0; }
  .ev.declined { opacity: .5; }
  .ev-date .dow { color: var(--accent); font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .ev-date .dm { display: block; font-size: 1.35rem; font-weight: 700; line-height: 1.1; margin-top: 2px; }
  .ev-date .yr { color: var(--faint); font-size: .82rem; }
  .ev-name { font-size: 1.15rem; font-weight: 600; letter-spacing: -.005em; }
  .ev-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pill { font-size: .74rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
  .pill.dist { border: 1px solid var(--border); color: var(--text); }
  .pill.dist.c1 { border-color: rgba(103,169,207,.5); } .pill.dist.c2 { border-color: rgba(224,134,59,.5); }
  .pill.dist.c3 { border-color: rgba(222,76,79,.5); } .pill.dist.c4 { border-color: rgba(142,53,56,.7); }
  .ev-loc { color: var(--muted); font-size: .9rem; display: inline-flex; align-items: center; gap: 5px; }
  .status { color: var(--muted); }
  .status:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.s-confirmed { color: var(--blue); }
  .status.s-pending { color: #e0a53b; }
  .status.s-declined { color: var(--faint); }
  .ev.flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%,100% { background: transparent; } 25% { background: rgba(222,76,79,.14); } }
  .more { font-size: .82rem; color: var(--accent); cursor: pointer; }
  .rdesc { font-size: .86rem; color: var(--muted); margin-top: 8px; white-space: pre-line; max-height: 0; overflow: hidden; transition: max-height .2s; }
  .ev.open .rdesc { max-height: 300px; overflow: auto; }

  .empty { color: var(--muted); font-size: .92rem; padding: 24px 0; }
  .subhead { font-family: var(--serif); font-size: 1.5rem; margin: 34px 0 4px; }
  footer { margin-top: 48px; color: var(--faint); font-size: .82rem; border-top: 1px solid var(--border); padding-top: 18px; }
  .note { font-size: .84rem; color: var(--muted); background: rgba(224,110,115,.08); border: 1px solid rgba(224,110,115,.25); border-radius: 10px; padding: 10px 13px; margin: 14px 0; display: none; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
</style>
</head>

<div class="wrap">

    <input class="search" id="q" type="search" placeholder="Search race or place…" />
  </div>

  <div class="statusline" id="statusline"></div>
  <div id="lists"></div>

  <footer>
    <div>Source: my <b>running</b> Google Calendar. The page tries a live read of the public
      <code>.ics</code> feed; if that isn&rsquo;t reachable it shows a saved snapshot.</div>
    <div style="margin-top:6px"><a href="index.html">&larr; back to home</a></div>
  </footer>
</div>

<script>

// same-origin — no CORS, no proxy, no API key. See scripts/build-races.mjs.

/* ------------------------------------------------------------------ *
 * 2. Parsing helpers
 * ------------------------------------------------------------------ */
function parseDistance(name) {
  var km = null, re = /(\d+(?:\.\d+)?)\s*k(?:m)?(?![a-z])/gi, m, last = null;
  while ((m = re.exec(name)) !== null) last = m[1];
  if (last !== null) km = parseFloat(last);
  if (km === null) {
    var low = name.toLowerCase();
    if (/\bhalf\b/.test(low) && /marathon/.test(low)) km = 21.1;
    else if (/marathon/.test(low)) km = 42.195;
  }
  if (km === null) {
    var b = name.match(/\b(\d{1,2}(?:\.\d+)?)\b/);
    if (b) { var v = parseFloat(b[1]); if (v >= 3 && v <= 60) km = v; }
  }
  return km;
}
function categoryOf(km) {
  if (km === null) return { key:"other", label:"Other", cls:"c0" };
  if (km < 8)  return { key:"short", label:"Fun run", cls:"c1" };
  if (km < 13) return { key:"10k",  label:"10K",  cls:"c2" };
  if (km < 18) return { key:"15k",  label:"15K",  cls:"c2" };
  if (km < 30) return { key:"half", label:"21K / Half", cls:"c3" };
  return { key:"full", label:"42K / Full", cls:"c4" };
}
function distDisplay(km) {
  if (km === null) return "—";
  var k = km;
  if (km === 42.195) k = 42; else if (km === 21.1) k = 21;
  return k + "K";
}
var INTL_KW = ["malaysia","kuala lumpur","japan","osaka","kanazawa","tokyo","china","beijing",
  "chengdu","singapore","korea","seoul","hong kong","vietnam","taiwan","indonesia","jakarta","laos"];
function detectIntl(name, loc) {
  var s = (name + " " + loc).toLowerCase();
  return INTL_KW.some(function (k) { return s.indexOf(k) >= 0; });
}
function normStatus(s) {
  s = (s || "").toLowerCase();
  if (s === "declined" || s === "cancelled" || s === "canceled") return "declined";
  if (s === "pending" || s === "lotto" || s === "needsaction" || s === "tentative") return "pending";
  return "confirmed";
}
function dateFromYMD(s) { var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }

function makeEvent(name, dateObj, loc, desc, status, intl) {
  var km = parseDistance(name);
  return {
    name: name, date: dateObj, loc: loc || "", desc: desc || "",
    status: normStatus(status), intl: (intl != null) ? !!intl : detectIntl(name, loc || ""),
    km: km, cat: categoryOf(km), year: dateObj.getFullYear()
  };
}
function fromSnapshot() {
  return SNAPSHOT.map(function (e) { return makeEvent(e.name, dateFromYMD(e.date), e.loc, e.desc, e.status, e.intl); });
}

/* ------------------------------------------------------------------ *

var ALL = [];
var filter = { timeline: "upcoming", locs: {}, dists: {}, q: "" };
var today = (function () { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); })();

function fmtGen(iso) {
  try { return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" }).format(new Date(iso)); }
  catch (e) { return String(iso || "").slice(0, 10); }
}
function setSource(kind, generated) {
  var el = document.getElementById("source");
  if (kind === "live") {
    el.textContent = generated ? "● Live · updated " + fmtGen(generated) : "● Live";
    el.className = "badge live";
  } else {
    el.textContent = "● Snapshot " + SNAPSHOT_DATE; el.className = "badge snap";
    var n = document.getElementById("snapNote");
    n.style.display = "block";
    n.innerHTML = "Couldn't load the auto-refreshed data file (<code>races.json</code>) — showing the built-in snapshot from " + SNAPSHOT_DATE + ".";
  }
}
function fetchWithTimeout(url, ms) {
  var ctrl = new AbortController(), t = setTimeout(function () { ctrl.abort(); }, ms);
  return fetch(url, { signal: ctrl.signal, cache: "no-store" }).then(function (r) {
    clearTimeout(t); if (!r.ok) throw new Error("HTTP " + r.status); return r.json();
  });
}
function boot() {
  fetchWithTimeout(RACES_URL + "?_=" + Date.now(), 9000).then(function (data) {
    var evs = (data && data.events) || [];
    if (!evs.length) throw new Error("empty");
    ALL = evs.map(function (e) { return makeEvent(e.name, dateFromYMD(e.date), e.loc, e.desc, e.status, e.intl); });
    setSource("live", data.generated); render();
  }).catch(function () {
    ALL = fromSnapshot(); setSource("snapshot"); render();
  });
}

/* ------------------------------------------------------------------ *
 * 4. Rendering
 * ------------------------------------------------------------------ */
var fmtDOW = new Intl.DateTimeFormat("en-US", { weekday: "short" });
var fmtDM  = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" });
var fmtFull = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });

function render() {
  ALL.sort(function (a, b) { return a.date - b.date; });
  renderSummary();
  renderCountdown();
  buildYears();
  renderHeatmap();
  renderLists();
}

function renderSummary() {
  var years = ALL.map(function (e) { return e.year; });
  var minY = Math.min.apply(null, years), maxY = Math.max.apply(null, years);
  var upcoming = ALL.filter(function (e) { return e.date >= today && e.status !== "declined"; }).length;
  var travel = ALL.filter(function (e) { return e.intl; }).length;
  var pending = ALL.filter(function (e) { return e.status === "pending"; }).length;
  var km = ALL.filter(function (e) { return e.km !== null && e.status !== "declined"; })
              .reduce(function (s, e) { return s + e.km; }, 0);
  var range = (minY === maxY) ? String(minY) : (minY + " – " + maxY);
  var parts = [
    range,
    "<b>" + ALL.length + "</b> events",
    "<b>" + upcoming + "</b> upcoming",
    "<b>" + travel + "</b> with travel",
    "<b>" + pending + "</b> lotto / pending",
    "<b>" + Math.round(km).toLocaleString() + "</b> km"
  ];
  document.getElementById("summary").innerHTML =
    parts.join('<span class="sep">/</span>');
}

function renderCountdown() {
  var next = ALL.filter(function (e) { return e.date >= today && e.status !== "declined"; })[0];
  var el = document.getElementById("countdown");
  if (!next) { el.style.display = "none"; return; }
  el.style.display = "flex";
  var days = Math.round((next.date - today) / 86400000);
  el.innerHTML = "Next race: <b>" + escapeHtml(next.name) + "</b> · " +
    (days === 0 ? '<span class="n">today</span>' : '<span class="n">' + days + '</span> days to go');
}

/* --- Race-intensity heatmap: month (cols) × week-of-month (rows) --- */
function buildYears() {
  var ys = {}; ALL.forEach(function (e) { ys[e.year] = true; });
  var arr = Object.keys(ys).sort();
  var sel = document.getElementById("hmYear"), prev = sel.value;
  sel.innerHTML = arr.map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join("");
  sel.value = prev || (ys[today.getFullYear()] ? String(today.getFullYear()) : arr[arr.length - 1]);
}
function weekOfMonth(day) { return Math.min(4, Math.floor((day - 1) / 7)); } // 0..4
function renderHeatmap() {
  var year = +document.getElementById("hmYear").value;
  var yearEvents = ALL.filter(function (e) { return e.year === year && e.status !== "declined"; });
  document.getElementById("hmTitle").textContent = year + " Race intensity";
  document.getElementById("hmCount").textContent =
    yearEvents.length + " races across 12 months";

  // bucket[month][week] = array of races
  var buckets = {};
  yearEvents.forEach(function (e) {
    var mo = e.date.getMonth(), wk = weekOfMonth(e.date.getDate());
    (buckets[mo + ":" + wk] = buckets[mo + ":" + wk] || []).push(e);
  });

  var monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var grid = document.getElementById("hm2");
  grid.innerHTML = "";
  var frag = document.createDocumentFragment();

  frag.appendChild(el("div", "", ""));                       // corner
  monthNames.forEach(function (mn) { frag.appendChild(el("div", "mlabel", mn)); });

  for (var wk = 0; wk < 5; wk++) {
    frag.appendChild(el("div", "wlabel", "W" + (wk + 1)));
    for (var mo = 0; mo < 12; mo++) {
      var races = buckets[mo + ":" + wk];
      var cell = document.createElement("div");
      cell.className = "cell";
      var sq = document.createElement("div");
      sq.className = "sq";
      if (races) {
        var n = races.length;
        var lvl = n >= 3 ? 4 : (n === 2 ? 3 : (races[0].km !== null && races[0].km >= 30 ? 2 : 1));
        sq.className = "sq s" + Math.min(4, n + 1) + " l" + lvl;
        cell.className = "cell has";
        var names = races.map(function (r) { return r.name; }).join(", ");
        cell.title = monthNames[mo] + " W" + (wk + 1) + " " + year + " · " + names;
        (function (r0) { cell.onclick = function () { jumpTo(r0); }; })(races[0]);
      }
      // past / current-week markers
      var wkStart = wk * 7 + 1, dim = new Date(year, mo + 1, 0).getDate();
      var wkEnd = Math.min(dim, wkStart + 6);
      var endDate = new Date(year, mo, wkEnd), startDate = new Date(year, mo, wkStart);
      if (endDate < today) cell.classList.add("past");
      else if (startDate <= today && today <= endDate) cell.classList.add("now");
      cell.appendChild(sq);
      frag.appendChild(cell);
    }
  }
  grid.appendChild(frag);
}
function el(tag, cls, txt) { var d = document.createElement(tag); if (cls) d.className = cls; if (txt) d.textContent = txt; return d; }

/* --- Filters + list --- */
function matches(e) {
  if (filter.timeline === "upcoming" && e.date < today) return false;
  var lk = Object.keys(filter.locs);
  if (lk.length) {
    var wantTh = filter.locs.th, wantIntl = filter.locs.intl;
    if (!((wantTh && !e.intl) || (wantIntl && e.intl))) return false;
  }
  var dk = Object.keys(filter.dists);
  if (dk.length && !filter.dists[e.cat.key]) return false;
  if (filter.q) {
    var q = filter.q.toLowerCase();
    if ((e.name + " " + e.loc).toLowerCase().indexOf(q) < 0) return false;
  }
  return true;
}
function renderLists() {
  var shown = ALL.filter(matches);
  var pending = shown.filter(function (e) { return e.status === "pending"; }).length;
  document.getElementById("statusline").textContent =
    "Showing " + shown.length + " of " + ALL.length + " events · " +
    (filter.timeline === "upcoming" ? "upcoming only" : "all races") +
    (pending ? " · " + pending + " lotto / pending" : "");

  var host = document.getElementById("lists");
  if (filter.timeline === "all") {
    var up = shown.filter(function (e) { return e.date >= today; });
    var pa = shown.filter(function (e) { return e.date < today; }).reverse();
    host.innerHTML = block("Upcoming", up) + block("Past", pa);
  } else {
    host.innerHTML = shown.length ? shown.map(rowHtml).join("") : '<div class="empty">No races match these filters.</div>';
  }
  wireRows();
}
function block(title, arr) {
  if (!arr.length) return "";
  return '<div class="subhead">' + title + '</div>' + arr.map(rowHtml).join("");
}
function rowHtml(e) {
  var idx = ALL.indexOf(e);
  var st = e.status === "declined" ? ["s-declined", "Skipped"] :
           e.status === "pending"  ? ["s-pending", "Lotto / pending"] :
           ["s-confirmed", "Confirmed"];
  var hasDesc = e.desc && e.desc.length > 0;
  return '<div class="ev' + (e.status === "declined" ? " declined" : "") + '" id="race-' + idx + '">' +
    '<div class="ev-date"><span class="dow">' + fmtDOW.format(e.date).toUpperCase() + '</span>' +
      '<span class="dm">' + fmtDM.format(e.date) + '</span>' +
      '<span class="yr">' + e.year + '</span></div>' +
    '<div class="ev-body"><div class="ev-name">' + escapeHtml(e.name) + '</div>' +
      '<div class="ev-row">' +
        '<span class="pill dist ' + e.cat.cls + '">' + distDisplay(e.km) + '</span>' +
        (e.loc ? '<span class="ev-loc">📍 ' + escapeHtml(e.loc) + '</span>' : '') +
        (e.intl ? '<span class="ev-loc">✈️</span>' : '') +
        '<span class="pill status ' + st[0] + '">' + st[1] + '</span>' +
        (hasDesc ? '<span class="more" data-idx="' + idx + '">details ▾</span>' : '') +
      '</div>' +
      (hasDesc ? '<div class="rdesc">' + escapeHtml(e.desc) + '</div>' : '') +
    '</div></div>';
}
function wireRows() {
  Array.prototype.forEach.call(document.querySelectorAll(".more"), function (m) {
    m.onclick = function () {
      var row = document.getElementById("race-" + m.getAttribute("data-idx"));
      row.classList.toggle("open");
      m.textContent = row.classList.contains("open") ? "details ▴" : "details ▾";
    };
  });
}
function jumpTo(e) {
  filter.timeline = "all"; filter.locs = {}; filter.dists = {}; filter.q = "";
  syncChips(); document.getElementById("q").value = "";
  renderLists();
  var row = document.getElementById("race-" + ALL.indexOf(e));
  if (row) { row.scrollIntoView({ behavior: "smooth", block: "center" });
             row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); }
}

/* ------------------------------------------------------------------ *
 * 5. Controls
 * ------------------------------------------------------------------ */
function syncChips() {
  setActive("#fTimeline", function (v) { return v === filter.timeline; });
  setActive("#fLoc", function (v) { return !!filter.locs[v]; });
  setActive("#fDist", function (v) { return !!filter.dists[v]; });
}
function setActive(sel, isOn) {
  Array.prototype.forEach.call(document.querySelectorAll(sel + " .chip"), function (b) {
    b.classList.toggle("on", isOn(b.getAttribute("data-v")));
  });
}
document.querySelectorAll("#fTimeline .chip").forEach(function (b) {
  b.addEventListener("click", function () { filter.timeline = b.getAttribute("data-v"); syncChips(); renderLists(); });
});
function toggleSet(setObj, v) { if (setObj[v]) delete setObj[v]; else setObj[v] = true; }
document.querySelectorAll("#fLoc .chip").forEach(function (b) {
  b.addEventListener("click", function () { toggleSet(filter.locs, b.getAttribute("data-v")); syncChips(); renderLists(); });
});
document.querySelectorAll("#fDist .chip").forEach(function (b) {
  b.addEventListener("click", function () { toggleSet(filter.dists, b.getAttribute("data-v")); syncChips(); renderLists(); });
});
document.getElementById("q").addEventListener("input", function (e) { filter.q = e.target.value; renderLists(); });
document.getElementById("hmYear").addEventListener("change", renderHeatmap);

/* Theme toggle (defaults to dark) */
(function () {
  var btn = document.getElementById("theme");
  function sysDark() { return !window.matchMedia("(prefers-color-scheme: light)").matches; }
  function apply(t) {
    document.documentElement.setAttribute("data-theme", t);
    btn.textContent = t === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("run-theme", t); } catch (e) {}
  }
  var saved; try { saved = localStorage.getItem("run-theme"); } catch (e) {}
  apply(saved || (sysDark() ? "dark" : "light"));
  btn.addEventListener("click", function () {
    apply(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
})();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

boot();
</script>
</body>
